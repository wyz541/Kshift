name: Release platform - macOS

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      channel:
        required: true
        type: string
      source_commit:
        required: true
        type: string
      tag:
        required: true
        type: string
    secrets:
      MACOS_CERTIFICATE_BASE64:
        required: false
      MACOS_CERTIFICATE_PASSWORD:
        required: false
      MACOS_KEYCHAIN_PASSWORD:
        required: false
      MACOS_SIGN_IDENTITY:
        required: false

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    name: macos
    runs-on: macos-26
    timeout-minutes: 60
    env:
      KSHIFT_VERSION: ${{ inputs.version }}
      KSHIFT_CHANNEL: ${{ inputs.channel }}
      KSHIFT_SOURCE_COMMIT: ${{ inputs.source_commit }}
      KSHIFT_OUTPUT_DIR: ${{ github.workspace }}/dist
      KSHIFT_RUST_PROFILE: release
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
      - name: Verify source commit
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$KSHIFT_SOURCE_COMMIT"
      - name: Install XcodeGen
        shell: bash
        run: brew install xcodegen
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.99.1
          targets: aarch64-apple-darwin
      - name: Detect optional macOS signing identity
        id: macos-signing
        if: ${{ inputs.channel == 'stable' || inputs.channel == 'hotfix' }}
        shell: bash
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          set -euo pipefail
          if [[ -n "$CERTIFICATE_BASE64$CERTIFICATE_PASSWORD$KEYCHAIN_PASSWORD$SIGN_IDENTITY" ]]; then
            test -n "$CERTIFICATE_BASE64"
            test -n "$CERTIFICATE_PASSWORD"
            test -n "$KEYCHAIN_PASSWORD"
            test -n "$SIGN_IDENTITY"
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Import optional macOS signing identity
        if: ${{ steps.macos-signing.outputs.configured == 'true' }}
        shell: bash
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          certificate="$RUNNER_TEMP/macos-signing.p12"
          python3 -c 'import base64, os; open(os.environ["RUNNER_TEMP"] + "/macos-signing.p12", "wb").write(base64.b64decode(os.environ["CERTIFICATE_BASE64"]))'
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import "$certificate" -k build.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain
      - name: Build and package macOS app
        shell: bash
        run: release/platform/build-macos.sh
      - name: Verify macOS runtime evidence
        shell: bash
        run: |
          set -euo pipefail
          zip="$KSHIFT_OUTPUT_DIR/kshift-$KSHIFT_VERSION-macos-arm64.zip"
          test -f "$zip"
          mkdir -p "$RUNNER_TEMP/macos-bundle"
          unzip -q "$zip" -d "$RUNNER_TEMP/macos-bundle"
          application="$(find "$RUNNER_TEMP/macos-bundle" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$application"
          if [[ "$KSHIFT_CHANNEL" == "stable" || "$KSHIFT_CHANNEL" == "hotfix" ]]; then
            evidence="$GITHUB_WORKSPACE/release/evidence/macos-runtime.json"
            test -s "$evidence"
            evidence_asset="kshift-$KSHIFT_VERSION-macos-runtime-evidence.json"
            cp "$evidence" "$KSHIFT_OUTPUT_DIR/$evidence_asset"
            expected_gates="$(jq -r '.stable_required_gates.macos | map(select(. != "build" and . != "signature")) | join(",")' release/policy.json)"
            node release/tools/runtime-evidence.mjs verify \
              --root "$GITHUB_WORKSPACE" \
              --evidence "$evidence" \
              --platform macos \
              --version "$KSHIFT_VERSION" \
              --channel "$KSHIFT_CHANNEL" \
              --candidate-commit "$KSHIFT_SOURCE_COMMIT" \
              --application "$application" \
              --expected-gates "$expected_gates" \
              --output "$RUNNER_TEMP/macos-runtime-gates.json"
            jq '[{"name":"build","status":"passed","evidence":"xcodebuild completed"},{"name":"signature","status":"passed","evidence":"codesign verification"}] + .gates' \
              "$RUNNER_TEMP/macos-runtime-gates.json" > "$RUNNER_TEMP/macos-gates.json"
            jq -n --arg name "$evidence_asset" \
              '[{name: $name, platform: "macos", architecture: "arm64", role: "evidence", signing_status: "not-applicable"}]' \
              > "$RUNNER_TEMP/macos-evidence-asset.json"
          else
            jq -n '[{"name":"build","status":"passed","evidence":"xcodebuild completed"},{"name":"signature","status":"passed","evidence":"codesign verification"}]' \
              > "$RUNNER_TEMP/macos-gates.json"
            for gate in $(jq -r '.stable_required_gates.macos[] | select(. != "build" and . != "signature")' release/policy.json); do
              jq --arg gate "$gate" \
                '. + [{name: $gate, status: "skipped", evidence: "runtime evidence is required only for Stable or Hotfix"}]' \
                "$RUNNER_TEMP/macos-gates.json" > "$RUNNER_TEMP/macos-gates.next.json"
              mv "$RUNNER_TEMP/macos-gates.next.json" "$RUNNER_TEMP/macos-gates.json"
            done
            printf '%s\n' '[]' > "$RUNNER_TEMP/macos-evidence-asset.json"
          fi
      - name: Create macOS fragment
        shell: bash
        run: |
          set -euo pipefail
          dmg="$KSHIFT_OUTPUT_DIR/kshift-$KSHIFT_VERSION-macos-arm64.dmg"
          zip="$KSHIFT_OUTPUT_DIR/kshift-$KSHIFT_VERSION-macos-arm64.zip"
          if [[ -n "${MACOS_SIGN_IDENTITY:-}" ]]; then
            signing_status="signed"
          else
            signing_status="ad-hoc"
          fi
          signature_gate="passed"
          jq --slurpfile gates "$RUNNER_TEMP/macos-gates.json" \
             --slurpfile evidence_asset "$RUNNER_TEMP/macos-evidence-asset.json" \
            -n \
            --arg version "$KSHIFT_VERSION" \
            --arg channel "$KSHIFT_CHANNEL" \
            --arg source "$KSHIFT_SOURCE_COMMIT" \
            --arg dmg "$(basename "$dmg")" \
            --arg zip "$(basename "$zip")" \
            --arg status "$signing_status" \
            --arg signature_gate "$signature_gate" \
            --arg notarization not-requested \
            --arg workflow "$GITHUB_WORKFLOW" \
            --arg run_id "$GITHUB_RUN_ID" \
            --argjson run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg generated "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              schema_version: "1",
              product: "Kshift",
              version: $version,
              channel: $channel,
              source_commit: $source,
              platform: "macos",
              architecture: "arm64",
              generated_at: $generated,
              signing: {
                status: $status,
                identity: (if $status == "signed" then "configured-developer-id" else null end),
                notarization: $notarization
              },
              provenance: {
                workflow: $workflow,
                run_id: $run_id,
                run_attempt: $run_attempt,
                artifact_id: "release-fragment-macos"
              },
              assets: [
                {name: $dmg, platform: "macos", architecture: "arm64", role: "application", signing_status: $status},
                {name: $zip, platform: "macos", architecture: "arm64", role: "application", signing_status: $status}
              ] + $evidence_asset[0],
              gates: $gates[0],
              limitations: (if $channel == "stable" or $channel == "hotfix" then [
                "Ad-hoc builds are intended for internal distribution and may be blocked by Gatekeeper outside the managed environment."
              ] else [
                "Ad-hoc builds are intended for internal distribution and may be blocked by Gatekeeper outside the managed environment.",
                "Stable promotion requires runtime lifecycle, Liquid Glass, accessibility and performance evidence."
              ] end)
            }' > "$KSHIFT_OUTPUT_DIR/macos.fragment.spec.json"
          node release/tools/kshift-release.mjs fragment \
            --spec "$KSHIFT_OUTPUT_DIR/macos.fragment.spec.json" \
            --assets-dir "$KSHIFT_OUTPUT_DIR" \
            --output "$KSHIFT_OUTPUT_DIR/macos.fragment.json"
      - name: Attest macOS artifacts
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45
        with:
          subject-path: |
            ${{ github.workspace }}/dist/kshift-*-macos-*.dmg
            ${{ github.workspace }}/dist/kshift-*-macos-*.zip
      - name: Upload macOS fragment
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-fragment-macos
          path: |
            ${{ github.workspace }}/dist/kshift-*-macos-*.dmg
            ${{ github.workspace }}/dist/kshift-*-macos-*.zip
            ${{ github.workspace }}/dist/macos.fragment.json
            ${{ github.workspace }}/dist/kshift-*-macos-runtime-evidence.json
          if-no-files-found: error
