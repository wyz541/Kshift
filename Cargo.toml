[workspace]
resolver = "2"
members = [
  "crates/kshift-core",
  "crates/kshift-client",
  "crates/kshift-ffi",
]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
chrono = { version = "0.4.42", features = ["clock", "serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
