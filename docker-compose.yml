services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: kshift_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kshift_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - kshift-postgres:/var/lib/postgresql/data

volumes:
  kshift-postgres:
