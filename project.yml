name: Kshift
options:
  bundleIdPrefix: com.wyz541.kshift
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    CLANG_ENABLE_MODULES: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
packages:
  Kshift:
    path: .
targets:
  KshiftMac:
    type: application
    platform: macOS
    sources:
      - path: Apps/KshiftMac
    dependencies:
      - package: Kshift
        product: KshiftUI
      - package: Kshift
        product: KshiftPlatform
    preBuildScripts:
      - name: Build Rust FFI
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          "$SRCROOT/scripts/build-ffi.sh" macos
          destination="$BUILT_PRODUCTS_DIR/$FRAMEWORKS_FOLDER_PATH"
          mkdir -p "$destination"
          cp "$SRCROOT/.build/ffi/macos/libkshift_ffi.dylib" "$destination/"
          if [[ "${CODE_SIGNING_ALLOWED:-YES}" == "YES" ]]; then
            /usr/bin/codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY:--}" --timestamp=none "$destination/libkshift_ffi.dylib"
          fi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wyz541.kshift.mac
        PRODUCT_NAME: Kshift
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Kshift
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
  KshiftIOS:
    type: application
    platform: iOS
    sources:
      - path: Apps/KshiftIOS
    dependencies:
      - package: Kshift
        product: KshiftUI
      - package: Kshift
        product: KshiftPlatform
    preBuildScripts:
      - name: Build Rust FFI
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          "$SRCROOT/scripts/build-ffi.sh" ios-simulator
          destination="$BUILT_PRODUCTS_DIR/$FRAMEWORKS_FOLDER_PATH"
          mkdir -p "$destination"
          cp "$SRCROOT/.build/ffi/ios-simulator/libkshift_ffi.dylib" "$destination/"
          if [[ "${CODE_SIGNING_ALLOWED:-YES}" == "YES" ]]; then
            /usr/bin/codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY:--}" --timestamp=none "$destination/libkshift_ffi.dylib"
          fi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wyz541.kshift.ios
        PRODUCT_NAME: KshiftIOS
        PRODUCT_MODULE_NAME: Kshift
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Kshift
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_IDENTITY: "-"
  KshiftIOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Apps/KshiftIOSTests
    dependencies:
      - target: KshiftIOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  KshiftIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Apps/KshiftIOSUITests
    dependencies:
      - target: KshiftIOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: KshiftIOS
schemes:
  KshiftMac:
    build:
      targets:
        KshiftMac: all
    run:
      config: Debug
  KshiftIOS:
    build:
      targets:
        KshiftIOS: all
        KshiftIOSTests: [test]
        KshiftIOSUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - name: KshiftIOSTests
          parallelizable: false
        - name: KshiftIOSUITests
          parallelizable: false
