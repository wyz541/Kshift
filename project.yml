name: Kshift
options:
  bundleIdPrefix: com.wyz541.kshift
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    CLANG_ENABLE_MODULES: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
packages:
  Kshift:
    path: .
targets:
  Kshift-macOS:
    type: application
    platform: macOS
    sources:
      - path: Apps/KshiftMacOS
    dependencies:
      - package: Kshift
        product: KshiftCore
      - package: Kshift
        product: KshiftUI
      - package: Kshift
        product: KshiftAppKitAdapter
    preBuildScripts:
      - name: Build Rust FFI
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          "$SRCROOT/scripts/build-ffi.sh" macos
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wyz541.kshift.mac
        PRODUCT_NAME: Kshift-macOS
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Kshift
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
  Kshift-iOS:
    type: application
    platform: iOS
    sources:
      - path: Apps/KshiftIOS
    dependencies:
      - package: Kshift
        product: KshiftCore
      - package: Kshift
        product: KshiftUI
      - package: Kshift
        product: KshiftUIKitAdapter
    preBuildScripts:
      - name: Build Rust FFI
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          "$SRCROOT/scripts/build-ffi.sh" ios-simulator
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wyz541.kshift.ios
        PRODUCT_NAME: Kshift-iOS
        PRODUCT_MODULE_NAME: Kshift
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Kshift
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_IDENTITY: "-"
  Kshift-iOS-PlannerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Apps/KshiftIOSTests
    dependencies:
      - target: Kshift-iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  Kshift-iOS-PlannerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Apps/KshiftIOSUITests
    dependencies:
      - target: Kshift-iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Kshift-iOS
schemes:
  Kshift-macOS:
    build:
      targets:
        Kshift-macOS: all
    run:
      config: Debug
  Kshift-iOS:
    build:
      targets:
        Kshift-iOS: all
        Kshift-iOS-PlannerTests: [test]
        Kshift-iOS-PlannerUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - name: Kshift-iOS-PlannerTests
          parallelizable: false
        - name: Kshift-iOS-PlannerUITests
          parallelizable: false
