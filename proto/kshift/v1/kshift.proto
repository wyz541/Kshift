// Kshift v1 public contract.
//
// Rules:
// - Package kshift.v1 is compatible-only. A breaking change needs a new major package.
// - Field numbers and names are permanent once released.
// - IDs are opaque strings. Clients must not parse them.
// - Dates use YYYY-MM-DD in the project time zone.
// - Timestamps use UTC RFC 3339 values and may be displayed in the user time zone.
syntax = "proto3";

package kshift.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/wyz541/Kshift/gen/go/kshift/v1;kshiftv1";

// ProjectRole is the server-authoritative project access level.
enum ProjectRole {
  PROJECT_ROLE_UNSPECIFIED = 0;
  PROJECT_ROLE_VIEWER = 1;
  PROJECT_ROLE_EDITOR = 2;
  PROJECT_ROLE_ADMIN = 3;
}

// TaskStatus is the workflow state of a task.
enum TaskStatus {
  TASK_STATUS_UNSPECIFIED = 0;
  TASK_STATUS_TODO = 1;
  TASK_STATUS_IN_PROGRESS = 2;
  TASK_STATUS_BLOCKED = 3;
  TASK_STATUS_DONE = 4;
}

// TaskPriority is the planning priority of a task.
enum TaskPriority {
  TASK_PRIORITY_UNSPECIFIED = 0;
  TASK_PRIORITY_NONE = 1;
  TASK_PRIORITY_LOW = 2;
  TASK_PRIORITY_MEDIUM = 3;
  TASK_PRIORITY_HIGH = 4;
  TASK_PRIORITY_URGENT = 5;
}

// ErrorCode identifies the stable application reason inside a gRPC status.
enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_AUTH_REQUIRED = 1;
  ERROR_CODE_FORBIDDEN = 2;
  ERROR_CODE_INVALID_INPUT = 3;
  ERROR_CODE_CONFLICT = 4;
  ERROR_CODE_RESET_REQUIRED = 5;
  ERROR_CODE_LIMIT_EXCEEDED = 6;
  ERROR_CODE_SCHEMA_MISMATCH = 7;
  ERROR_CODE_INVALID_STATE = 8;
  ERROR_CODE_INTERNAL = 9;
  ERROR_CODE_ALREADY_EXISTS = 10;
  ERROR_CODE_FAILED_PRECONDITION = 11;
}

// StringList preserves presence for repeated values in a patch.
message StringList {
  repeated string values = 1;
}

// ErrorDetail is encoded in gRPC status details.
message ErrorDetail {
  ErrorCode code = 1;
  string message = 2;
  string request_id = 3;
  string project_id = 4;
  string entity_id = 5;
  optional uint64 current_project_revision = 6;
  optional uint64 current_entity_version = 7;
  optional uint64 minimum_retained_revision = 8;
}

// Project is the top-level isolation boundary.
message Project {
  string id = 1;
  string name = 2;
  // IANA time zone that defines natural-date semantics for this project.
  string time_zone = 3;
  uint64 revision = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

// User is a project member identity. The authentication source is resolved later.
message User {
  string id = 1;
  string display_name = 2;
  optional string email = 3;
}

// ProjectMember binds a user to one role in one project.
message ProjectMember {
  string user_id = 1;
  ProjectRole role = 2;
}

// Task is the shared planning unit.
message Task {
  string id = 1;
  string project_id = 2;
  string title = 3;
  string description_markdown = 4;
  TaskStatus status = 5;
  TaskPriority priority = 6;
  // Unique active project-member IDs, sorted by user ID. Empty means unassigned.
  repeated string assignee_ids = 7;
  string planned_on = 8;
  optional string starts_on = 9;
  optional string due_on = 10;
  repeated string tags = 11;
  optional string parent_task_id = 12;
  repeated string dependency_task_ids = 13;
  uint64 version = 14;
  string created_by = 15;
  string updated_by = 16;
  google.protobuf.Timestamp created_at = 17;
  google.protobuf.Timestamp updated_at = 18;
}

// TaskDraft is the input for a new task.
message TaskDraft {
  string title = 1;
  string description_markdown = 2;
  TaskStatus status = 3;
  TaskPriority priority = 4;
  // Replacement set of at most 20 unique active project-member IDs.
  repeated string assignee_ids = 5;
  string planned_on = 6;
  optional string starts_on = 7;
  optional string due_on = 8;
  repeated string tags = 9;
  optional string parent_task_id = 10;
  repeated string dependency_task_ids = 11;
}

// TaskPatch changes only fields with presence.
message TaskPatch {
  optional string title = 1;
  optional string description_markdown = 2;
  optional TaskStatus status = 3;
  optional TaskPriority priority = 4;
  // Absent keeps the current set. A present empty list clears all assignees.
  optional StringList assignee_ids = 5;
  optional string planned_on = 6;
  optional string starts_on = 7;
  optional string due_on = 8;
  optional StringList tags = 9;
  optional string parent_task_id = 10;
  optional StringList dependency_task_ids = 11;
}

// CreateProjectCommand creates one project.
message CreateProjectCommand {
  string name = 1;
  string time_zone = 2;
}

// AddProjectMemberCommand adds or changes one project member.
message AddProjectMemberCommand {
  string user_id = 1;
  ProjectRole role = 2;
}

// CreateTaskCommand creates one task.
message CreateTaskCommand {
  TaskDraft draft = 1;
}

// UpdateTaskCommand updates one task with optimistic concurrency.
message UpdateTaskCommand {
  string task_id = 1;
  uint64 expected_entity_version = 2;
  TaskPatch patch = 3;
}

// DeleteTaskCommand removes one task with optimistic concurrency.
message DeleteTaskCommand {
  string task_id = 1;
  uint64 expected_entity_version = 2;
}

// TaskMutation is one item in an atomic batch.
message TaskMutation {
  oneof mutation {
    CreateTaskCommand create_task = 1;
    UpdateTaskCommand update_task = 2;
    DeleteTaskCommand delete_task = 3;
  }
}

// BatchUpdateTasksCommand applies all mutations or none.
message BatchUpdateTasksCommand {
  repeated TaskMutation mutations = 1;
}

// CommandEnvelope is the only write request shape.
message CommandEnvelope {
  string client_id = 1;
  string command_id = 2;
  string project_id = 3;
  optional uint64 expected_project_revision = 4;

  oneof command {
    CreateTaskCommand create_task = 10;
    UpdateTaskCommand update_task = 11;
    DeleteTaskCommand delete_task = 12;
    BatchUpdateTasksCommand batch_update_tasks = 13;
    CreateProjectCommand create_project = 14;
    AddProjectMemberCommand add_project_member = 15;
  }
}

// TaskUpserted carries the complete task after a task change.
message TaskUpserted {
  Task task = 1;
}

// TaskDeleted identifies a removed task.
message TaskDeleted {
  string task_id = 1;
}

// ProjectUpserted carries the complete project after a project change.
message ProjectUpserted {
  Project project = 1;
}

// ProjectMemberUpserted carries the complete member after a member change.
message ProjectMemberUpserted {
  ProjectMember member = 1;
}

// ProjectMemberDeleted identifies a removed member.
message ProjectMemberDeleted {
  string user_id = 1;
}

// Change is one entity delta inside a project event.
message Change {
  oneof change {
    TaskUpserted task_upserted = 1;
    TaskDeleted task_deleted = 2;
    ProjectUpserted project_upserted = 3;
    ProjectMemberUpserted member_upserted = 4;
    ProjectMemberDeleted member_deleted = 5;
  }
}

// ProjectChangeEvent is the durable outbox payload.
message ProjectChangeEvent {
  string schema_version = 1;
  string project_id = 2;
  uint64 revision = 3;
  string command_id = 4;
  repeated Change changes = 5;
  google.protobuf.Timestamp committed_at = 6;
}

// ProjectAuditEntry is one bounded audit record in a project snapshot.
message ProjectAuditEntry {
  string id = 1;
  optional uint64 revision = 2;
  string action = 3;
  string summary = 4;
  optional string task_id = 5;
  string actor_id = 6;
  google.protobuf.Timestamp occurred_at = 7;
}

// GetProjectSnapshotResponse returns an immutable full project view.
message GetProjectSnapshotResponse {
  string schema_version = 1;
  uint64 revision = 2;
  Project project = 3;
  repeated User users = 4;
  repeated ProjectMember members = 5;
  repeated Task tasks = 6;
  google.protobuf.Timestamp generated_at = 7;
  repeated ProjectAuditEntry audit = 8;
}

// CommandResult is the committed outcome of a write.
message CommandResult {
  string command_id = 1;
  uint64 project_revision = 2;
  ProjectChangeEvent event = 3;
}

// ListProjectsRequest has no filters in v1.
message ListProjectsRequest {}

// ListProjectsResponse returns projects visible to the authenticated user.
message ListProjectsResponse {
  repeated Project projects = 1;
}

// GetProjectSnapshotRequest starts or refreshes a project view.
message GetProjectSnapshotRequest {
  string project_id = 1;
}

// ExecuteCommandRequest wraps one idempotent typed command.
message ExecuteCommandRequest {
  CommandEnvelope command = 1;
}

// ExecuteCommandResponse returns the committed result.
message ExecuteCommandResponse {
  CommandResult result = 1;
}

// WatchProjectChangesRequest replays events after since_revision.
message WatchProjectChangesRequest {
  string project_id = 1;
  uint64 since_revision = 2;
}

// Heartbeat keeps idle streams alive and reports the current revision.
message Heartbeat {
  uint64 project_revision = 1;
  google.protobuf.Timestamp sent_at = 2;
}

// ResetRequired tells the client to discard deltas and fetch a snapshot.
message ResetRequired {
  uint64 current_revision = 1;
  string reason = 2;
  uint64 minimum_retained_revision = 3;
}

// WatchProjectChangesResponse is one event, heartbeat, or reset instruction.
message WatchProjectChangesResponse {
  oneof payload {
    ProjectChangeEvent event = 1;
    Heartbeat heartbeat = 2;
    ResetRequired reset_required = 3;
  }
}

// PlanActorRole is the server-authoritative role for one R3 request.
enum PlanActorRole {
  PLAN_ACTOR_ROLE_UNSPECIFIED = 0;
  PLAN_ACTOR_ROLE_VIEWER = 1;
  PLAN_ACTOR_ROLE_EDITOR = 2;
  PLAN_ACTOR_ROLE_ADMIN = 3;
}

// PlanProject identifies the R3 snapshot revision.
message PlanProject {
  string id = 1;
  string name = 2;
  uint64 revision = 3;
  uint32 schema_version = 4;
}

// PlanPerson is one project member shown in R3 views.
message PlanPerson {
  string id = 1;
  string name = 2;
  string initials = 3;
  string color_hex = 4;
}

// PlanTask is the complete R3 task state.
message PlanTask {
  string id = 1;
  string project_id = 2;
  optional string parent_id = 3;
  string title = 4;
  string description_markdown = 5;
  TaskStatus status = 6;
  TaskPriority priority = 7;
  optional string assignee_id = 8;
  string starts_on = 9;
  string due_on = 10;
  uint32 estimate_minutes = 11;
  int64 position = 12;
  uint64 version = 13;
  optional string completed_at = 14;
}

// PlanTaskDependency is one directed dependency edge.
message PlanTaskDependency {
  string task_id = 1;
  string depends_on_task_id = 2;
}

// PlanAttachment is immutable attachment metadata.
message PlanAttachment {
  string id = 1;
  string sha256 = 2;
  string media_type = 3;
  uint64 byte_size = 4;
  string filename = 5;
}

// PlanAttachmentLink binds one attachment to one task.
message PlanAttachmentLink {
  string attachment_id = 1;
  string task_id = 2;
}

// PlanHistoryEntry is one immutable R3 history record.
message PlanHistoryEntry {
  string id = 1;
  uint64 revision = 2;
  string actor_id = 3;
  string action = 4;
  string summary = 5;
  string occurred_at = 6;
  optional uint64 restored_from_revision = 7;
  string content_sha256 = 8;
}

// PlanDepthSnapshot is the immutable R3 project view.
message PlanDepthSnapshot {
  PlanProject project = 1;
  repeated PlanPerson people = 2;
  repeated PlanTask tasks = 3;
  repeated PlanTaskDependency dependencies = 4;
  repeated PlanAttachment attachments = 5;
  repeated PlanAttachmentLink attachment_links = 6;
  repeated PlanHistoryEntry history = 7;
}

// SetPlanTaskStatusCommand changes only status and task version.
message SetPlanTaskStatusCommand {
  string task_id = 1;
  TaskStatus status = 2;
  uint64 expected_version = 3;
}

// RollbackPlanCommand restores one retained revision as a new revision.
message RollbackPlanCommand {
  uint64 target_revision = 1;
  string reason = 2;
}

// PlanCommand is one typed R3 write request.
message PlanCommand {
  oneof command {
    SetPlanTaskStatusCommand set_task_status = 1;
    RollbackPlanCommand rollback = 2;
  }
}

// GetPlanDepthSnapshotRequest fetches one project's R3 snapshot.
message GetPlanDepthSnapshotRequest {
  string project_id = 1;
}

// GetPlanDepthSnapshotResponse returns the snapshot and caller role.
message GetPlanDepthSnapshotResponse {
  PlanDepthSnapshot snapshot = 1;
  PlanActorRole actor_role = 2;
}

// ExecutePlanDepthCommandRequest wraps one idempotent R3 command.
message ExecutePlanDepthCommandRequest {
  string request_id = 1;
  string project_id = 2;
  uint64 expected_revision = 3;
  PlanCommand command = 4;
}

// ExecutePlanDepthCommandResponse returns the committed R3 snapshot.
message ExecutePlanDepthCommandResponse {
  PlanDepthSnapshot snapshot = 1;
  PlanActorRole actor_role = 2;
}

// PlanReportRange is an inclusive natural-date range.
message PlanReportRange {
  string starts_on = 1;
  string ends_on = 2;
}

// PlanReportTask is one task row in an R3 report.
message PlanReportTask {
  string id = 1;
  string title = 2;
  optional string parent_title = 3;
  TaskStatus status = 4;
  TaskPriority priority = 5;
  optional string assignee_name = 6;
  string starts_on = 7;
  string due_on = 8;
  uint32 estimate_minutes = 9;
  bool cross_day = 10;
  bool overdue = 11;
  uint32 dependency_count = 12;
  uint32 subtask_count = 13;
  uint32 attachment_count = 14;
}

// PlanReportStatistics is the report summary.
message PlanReportStatistics {
  uint32 task_count = 1;
  uint32 completed_count = 2;
  uint32 overdue_count = 3;
  uint32 cross_day_count = 4;
  uint32 total_estimate_minutes = 5;
}

// PlanWorkReport is one revision-pinned R3 report.
message PlanWorkReport {
  uint64 source_revision = 1;
  string generated_at = 2;
  PlanReportRange range = 3;
  repeated PlanReportTask tasks = 4;
  PlanReportStatistics statistics = 5;
}

// GetPlanDepthReportRequest builds one report for a retained snapshot.
message GetPlanDepthReportRequest {
  string project_id = 1;
  string starts_on = 2;
  string ends_on = 3;
  string today = 4;
}

// GetPlanDepthReportResponse returns one revision-pinned report.
message GetPlanDepthReportResponse {
  PlanWorkReport report = 1;
}

// KshiftService is the only server API used by kshift-client.
service KshiftService {
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse);
  rpc GetProjectSnapshot(GetProjectSnapshotRequest) returns (GetProjectSnapshotResponse);
  rpc ExecuteCommand(ExecuteCommandRequest) returns (ExecuteCommandResponse);
  rpc WatchProjectChanges(WatchProjectChangesRequest) returns (stream WatchProjectChangesResponse);
  rpc GetPlanDepthSnapshot(GetPlanDepthSnapshotRequest) returns (GetPlanDepthSnapshotResponse);
  rpc ExecutePlanDepthCommand(ExecutePlanDepthCommandRequest) returns (ExecutePlanDepthCommandResponse);
  rpc GetPlanDepthReport(GetPlanDepthReportRequest) returns (GetPlanDepthReportResponse);
}
